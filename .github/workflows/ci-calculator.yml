name: Java CI - Calculator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 11 and cache Maven dependencies
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile the project
        run: mvn -B clean compile

      - name: Run unit tests
        run: mvn -B test
