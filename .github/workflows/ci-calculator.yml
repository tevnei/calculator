name: Java CI - Calculator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # 开启 Maven 依赖缓存

      - name: Compile the project
        run: mvn -B clean compile

      - name: Run unit tests
        run: mvn -B test